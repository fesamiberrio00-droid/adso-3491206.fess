<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section{
            div.jungle{
                background: url(imgs/jungle.png) no-repeat center top /contain;
                height: 460px;
                margin: 0.4rem auto;
                overflow: hidden;
                position: relative;
                width: 380px;

                img{
                    position: absolute;

                    &.logo{
                        top: 30px;
                        left: 30px;
                        animation: 2s animaLogo infinite ease;
                    }
                    &.dk {
                        top: 184px;
                        left: 120px;
                        width: 140px;
                        animation: 2s animDK infinite linear;
                    }
                }
                div.move {
                    position: absolute;
                    left: -140;
                    bottom: 150px;
                    width: 120px;
                    animation: 4s animMove infinite linear;       

                    img.ryno {
                        width: 120px;
                        animation: 0.2s animRyno infinite ease;
                    }
                }
            }
        }
        @keyframes animaLogo {
            0%,100% { transform: scale(0.8); }
            50%     { transform: scale(1.2); }
        }
        @keyframes animDK {
            0% { transform: rotatey(0deg) translateY(0px); }
            25% { transform: rotatey(0deg) translateY(-80px) ; }
            50% { transform: rotatey(180deg) translateY(-80px); }
            75% { transform: rotatey(0deg) translateY(-80px); }
            100% { transform: rotatey(0deg) translateY(0px); }
            
        }
        @keyframes animRyno {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-4px); }
        }
        @keyframes animMove {
            0%  { transform: rotateY(0deg);    bottom: 150px;  left: -140px; }
            8%  { transform: rotateY(0deg);    bottom: 150px;  left: 120px; }
            10% { transform: rotateY(0deg);    bottom: 220px;  left: 120px; }
            12% { transform: rotateY(0deg);    bottom: 150px;  left: 120px; }
            50% { transform: rotateY(0deg);    bottom: 150px;  left: 400px;  }
            51% { transform: rotateY(-180deg); bottom: 150px;  left: 400px;  }
            52% { transform: rotateY(-180deg); bottom: 150px;  left: 400px;  }
            60% { transform: rotateY(-180deg); bottom: 150px;  left: 120px;  }
            62% { transform: rotateY(-180deg); bottom: 220px;  left: 120px;  }
            64% { transform: rotateY(-180deg); bottom: 150px;  left: 120px;  }
            99% { transform: rotateY(-180deg); bottom: 150px;  left: -140px; }
            100%{ transform: rotateY(0deg);    bottom: 150px;  left: -140px; }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>37-animations</h1>
            <img src="../src/imgs/logo-css.png" alt="CSS">
            <h3> Feature using @keyframes to create multi-step keyframed visual changes without JavaScript intervention.</h3>
        </header>
        <section>
            <div class="jungle">
                <img src="imgs/logo-dk.png" class="logo">
                <img src="imgs/dk.png" class="dk">
                <div class="move">
                    <img src="imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
