<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20-pseudoclasses</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        /* 1. Hover: Cuando pasas el mouse */
        .boton {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }

        .boton:hover {
            background-color: #2980b9; /* Cambia a azul oscuro */
        }

        /* 2. Active: Cuando haces click */
        .boton:active {
            background-color: #e74c3c; /* Cambia a rojo al clickear */
        }

        /* 3. Focus: Cuando seleccionas un input */
        input:focus {
            outline: 3px solid green;
            background-color: #e8f8f5;
        }

        /* 4. First-child / nth-child: Seleccionar elementos específicos */
        ul li:first-child {
            color: red;
            font-weight: bold;
        }
        
        ul li:nth-child(2) {
            color: blue;
        }
    </style>
</head>
