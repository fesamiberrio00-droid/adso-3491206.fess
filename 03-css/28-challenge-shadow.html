<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>28-Challenge Shadow</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        figure.frame {
            background-color: #fff;
            height: calc(21 * 20px); /* Y:21 */
            width:  calc(22 * 20px); /* X:22 */
            margin: 2rem auto;
            zoom: 0.60;
            transition: all 0.4s ease-in;
            &:hover {
                transform: scale(1.4);
            }
        }
        div.squares {
            background: url(imgs/square.png);
            opacity: 0.4;
            z-index: 2;
            margin-top: -20px;
            height: calc(21 * 20px);
        }
        div.ironman {
            background-color: transparent;
            height: 20px;
            width: 20px;
            box-shadow: 20px 0 0 0 #fff,
                        40px 0 0 0 #fff,
                        80px 0 0 0 #fff,
                        60px 0 0 0 #fff,
                        80px 0 0 0 #fff,
                        100px 0 0 0 #fff,
                        120px 0 0 0 #fff,
                        140px 0 0 0 #fff,
                        160px 0 0 0 #fff,
                        180px 0 0 0 #fff,
                        200px 0 0 0 #fff,
                        220px 0 0 0 #fff,
                        240px 0 0 0 #fff,
                        260px 0 0 0 #fff,
                        280px 0 0 0 #fff,
                        300px 0 0 0 #fff,
                        320px 0 0 0 #fff,
                        340px 0 0 0 #fff,
                        360px 0 0 0 #fbb03d,
                        380px 0 0 0 #fff,
                        400px 0 0 0 #fff;
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>28-Challenge Shadow</h1>
            <img src="../src/imgs/logo-css.png" alt="Css">
            <h3>PixelArt (Shoto)</h3>
        </header>
        <section>
            <h2 class="subtitle">Shoto:</h2>
            <figure class="frame">
                <div class="ironman"></div>
                <div class="squares"></div>
            </figure>
        </section>
    </main>
</body>
</html>
